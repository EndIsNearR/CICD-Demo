name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-azure-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  react-build:
    name: React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "fakhar-abbas-react"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

  deploy-to-vm:
    name: Deploy React app to VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform-validation, react-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build React app for deployment
        working-directory: "fakhar-abbas-react"
        run: |
          npm ci
          npm run build

      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy-output
          cp -r "fakhar-abbas-react/dist"/* deploy-output/
          tar -czf app.tar.gz -C deploy-output .

      - name: Deploy to dedicated app host VM
        run: |
          az vm run-command invoke \
            --resource-group rg-compute \
            --name vm-az104lab08-apphost \
            --command-id RunShellScript \
            --scripts "bash -lc 'sudo mkdir -p /var/www/fakhar-abbas-react && sudo rm -rf /var/www/fakhar-abbas-react/* && sudo apt-get update && sudo apt-get install -y nginx >/dev/null && sudo systemctl enable nginx && sudo systemctl start nginx && sudo tee /etc/nginx/sites-available/default > /dev/null <<\"EOF\"\nserver {\n    listen 80 default_server;\n    listen [::]:80 default_server;\n    root /var/www/fakhar-abbas-react;\n    index index.html;\n    location / {\n        try_files \$uri \$uri/ /index.html;\n    }\n}\nEOF\nsudo systemctl reload nginx'" \
            --output none

          az vm run-command invoke \
            --resource-group rg-compute \
            --name vm-az104lab08-apphost \
            --command-id RunShellScript \
            --scripts "bash -lc 'sudo tar -xzf - -C /var/www/fakhar-abbas-react'" \
            --input-file app.tar.gz
