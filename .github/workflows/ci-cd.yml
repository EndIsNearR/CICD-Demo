name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-azure-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

  react-build:
    name: React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "fakhar-abbas-react"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

  deploy-to-vm:
    name: Deploy React app to VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform-validation, react-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry acraz104lab08 \
            --image fakhar-abbas-react:${{ github.sha }} \
            --image fakhar-abbas-react:latest \
            fakhar-abbas-react

      - name: Deploy container on VM
        run: |
          az vm run-command invoke \
            --resource-group rg-compute \
            --name vm-az104lab08-apphost \
            --command-id RunShellScript \
            --scripts "
              which docker || (curl -fsSL https://get.docker.com | sudo sh)
              az login --identity --output none
              az acr login --name acraz104lab08
              sudo docker pull acraz104lab08.azurecr.io/fakhar-abbas-react:latest
              sudo docker stop fakhar-abbas-react || true
              sudo docker rm fakhar-abbas-react || true
              sudo docker run -d \
                --name fakhar-abbas-react \
                --restart unless-stopped \
                -p 80:80 \
                acraz104lab08.azurecr.io/fakhar-abbas-react:latest
            "
                      
